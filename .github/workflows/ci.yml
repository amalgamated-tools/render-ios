name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runs on the self-hosted Apple Silicon runner (RENDER-PV). Toolchain is whatever Xcode is
# selected on that machine rather than a pinned DEVELOPER_DIR, so the runner tracks the same
# Xcode the project is developed against. The "Show toolchain" step below records what actually
# ran, so a toolchain-caused failure is diagnosable from the log.
jobs:
  test:
    name: RenderAPI tests
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: Packages/RenderAPI/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/RenderAPI/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # No network access is needed by the tests themselves — every test drives a StubTransport.
      - name: Test
        run: make test-package

  test-app:
    name: App tests
    runs-on: [self-hosted, macOS, ARM64]
    # The runner shares a Mac with interactive development, and a simulator device is shared
    # mutable state: every checkout installs the same bundle ID, so a local build reinstalling
    # RenderiOS mid-run kills the test host ("Test crashed with signal kill before establishing
    # connection"). CI therefore drives its own device instance, which nothing else targets.
    env:
      SIMULATOR: CI iPhone 17 Pro
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version

      - name: Cache resolved SPM checkouts
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: xcode-spm-${{ runner.os }}-${{ hashFiles('Packages/RenderAPI/Package.resolved') }}
          restore-keys: xcode-spm-${{ runner.os }}-

      # Created once and reused across runs. The explicit re-check matters: test-destination.sh
      # falls back to any available iPhone when $SIMULATOR is missing, which would silently put CI
      # back on the shared device this job exists to avoid — better to fail here than to go green
      # on the wrong device.
      - name: Ensure the CI simulator exists
        run: |
          if ! xcrun simctl list devices available | grep -qF "    $SIMULATOR ("; then
            echo "Creating $SIMULATOR"
            xcrun simctl create "$SIMULATOR" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
          fi
          xcrun simctl list devices available | grep -qF "    $SIMULATOR (" || {
            echo "!!! $SIMULATOR is still unavailable — refusing to fall back to a shared device" >&2
            exit 1
          }

      # Unlike a build, running tests needs a concrete simulator; Scripts/test-destination.sh picks
      # one that exists on the runner rather than pinning a device GitHub may drop.
      # Own DerivedData, started clean whenever the generated API client changes. See the script.
      - name: Test
        run: |
          DD=$(Scripts/ci-derived-data.sh test)
          make test-app XCODEBUILD_FLAGS="-clonedSourcePackagesDirPath .spm-cache -derivedDataPath $DD"

  build:
    name: Build app
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version

      - name: Cache resolved SPM checkouts
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: xcode-spm-${{ runner.os }}-${{ hashFiles('Packages/RenderAPI/Package.resolved') }}
          restore-keys: xcode-spm-${{ runner.os }}-

      # 'generic/platform=iOS Simulator' compiles for the simulator SDK without requiring a
      # specific device to exist on the runner, so CI does not break when GitHub rotates
      # the installed simulator set.
      - name: Build
        run: |
          DD=$(Scripts/ci-derived-data.sh build)
          make build DESTINATION='generic/platform=iOS Simulator' \
            XCODEBUILD_FLAGS="-clonedSourcePackagesDirPath .spm-cache -derivedDataPath $DD"
